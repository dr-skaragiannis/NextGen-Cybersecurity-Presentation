name: Deploy to GitHub Pages

on:
  push:
    branches:
      - arena/01a0ceea-nextgen-cybersecurity-presenta
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (single-file HTML)
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Diagnose Pages API (on failure)
        if: failure()
        run: |
          {
            echo "== GET /pages =="
            curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages"
            echo
            echo "== POST /pages build_type=workflow =="
            curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" -H "Accept: application/vnd.github+json" \
              -d '{"build_type":"workflow"}' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages"
            echo
          } > diag.txt
          cat diag.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diag
          path: diag.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
